  <!-- head -->
  <circle cx="32" cy="35" r="20" fill="#6A88F2"/>
  <!-- glasses -->
  <rect x="16.5" y="27.5" width="14" height="12" rx="4.5" fill="#10131A"/>
  <rect x="33.5" y="27.5" width="14" height="12" rx="4.5" fill="#10131A"/>
  <rect x="30" y="32" width="4" height="2.4" fill="#10131A"/>
