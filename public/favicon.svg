  <circle cx="23.5" cy="33.5" r="2.6" fill="#ECEAE2"/>
  <circle cx="40.5" cy="33.5" r="2.6" fill="#ECEAE2"/>
  <circle cx="24.4" cy="32.6" r=".9" fill="#10131A"/>
  <circle cx="41.4" cy="32.6" r=".9" fill="#10131A"/>
  <!-- smile -->
